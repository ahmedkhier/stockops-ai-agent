services:
  - type: web
    name: stockops-ai-agent
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/generate_samples.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
