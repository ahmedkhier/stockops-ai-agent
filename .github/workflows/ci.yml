name: StockOps CI & Guardrail Evals

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic invoices
        run: python scripts/generate_samples.py

      - name: Run Pytest suite (22 guardrail & pipeline tests)
        run: pytest -v

      - name: Run deterministic supply-chain benchmark
        run: python evals/run_benchmark.py
